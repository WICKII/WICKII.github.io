<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | WICKII Blog</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe8;
        --surface: rgba(255, 255, 255, 0.92);
        --text: #1f2933;
        --muted: #6b7280;
        --accent: #115e59;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.18), transparent 26rem),
          radial-gradient(circle at right, rgba(249, 115, 22, 0.12), transparent 24rem),
          var(--bg);
        color: var(--text);
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      }

      main {
        width: min(42rem, 100%);
        padding: 2rem;
        border-radius: 1.75rem;
        background: var(--surface);
        box-shadow: 0 20px 45px rgba(31, 41, 51, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3.5rem);
      }

      p {
        margin: 0.75rem 0;
        color: var(--muted);
        line-height: 1.7;
      }

      a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline</h1>
      <p>网络似乎出现了问题，当前无法加载最新内容。</p>
      <p>等连接恢复后再回来看看，或者先返回 <a href="/">首页</a>。</p>
    </main>
  </body>
</html>
